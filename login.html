<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClaimSight — Login</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Login-specific overrides ─────────────────── */
    body {
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg);
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 1.25rem;
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .login-brand-row {
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .login-brand svg {
      width: 32px;
      height: 32px;
      color: var(--blue);
    }

    .login-brand-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -.4px;
    }

    .login-brand-tagline {
      font-size: .82rem;
      color: var(--text-muted);
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      padding: 2rem 2rem 1.75rem;
    }

    .login-card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: .35rem;
    }

    .form-group input {
      width: 100%;
      padding: .7rem .9rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: .9rem;
      color: var(--text);
      background: #fafbfd;
      transition: border-color .15s, box-shadow .15s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
      background: #fff;
    }

    .btn-login {
      width: 100%;
      padding: .75rem;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      margin-top: .5rem;
      position: relative;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }

    .btn-login:hover:not(:disabled) { background: var(--blue-hover); }
    .btn-login:disabled { opacity: .65; cursor: not-allowed; }

    .btn-login .btn-spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .65s linear infinite;
    }

    .btn-login.loading .btn-text { opacity: 0; }
    .btn-login.loading .btn-spinner { display: inline-block; position: absolute; }

    /* Demo credentials box */
    .demo-creds {
      margin-top: 1.5rem;
      background: #f8fafc;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: .9rem 1rem;
    }

    .demo-creds-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .6rem;
    }

    .demo-creds-label {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
    }

    .btn-fill {
      padding: .25rem .7rem;
      font-size: .75rem;
      font-weight: 600;
      background: transparent;
      border: 1.5px solid var(--blue);
      color: var(--blue);
      border-radius: var(--radius-pill);
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
    }

    .btn-fill:hover { background: #eff6ff; }

    .demo-creds-row {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      font-size: .82rem;
      margin-bottom: .2rem;
    }

    .demo-creds-row span:first-child {
      color: var(--text-muted);
      width: 68px;
      flex-shrink: 0;
    }

    .demo-creds-row code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: .82rem;
      color: var(--navy);
      background: #e8edf5;
      padding: .1rem .45rem;
      border-radius: 4px;
    }

    /* Error message */
    .login-error {
      font-size: .8rem;
      color: var(--red);
      text-align: center;
      min-height: 1.2rem;
      margin: .5rem 0 0;
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: .75rem;
      color: var(--text-light);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">

    <!-- Brand -->
    <div class="login-brand">
      <div class="login-brand-row">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="2"/>
          <path d="M16 8v8l5 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="2" fill="currentColor"/>
        </svg>
        <span class="login-brand-name">ClaimSight</span>
      </div>
      <span class="login-brand-tagline">Faster decisions. Consistent assessments.</span>
    </div>

    <!-- Login card -->
    <div class="login-card">
      <h2>Sign in to your account</h2>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" />
        </div>
        <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
        <button type="submit" id="login-btn" class="btn-login">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Demo credentials -->
      <div class="demo-creds">
        <div class="demo-creds-header">
          <span class="demo-creds-label">Demo credentials</span>
          <button type="button" id="fill-btn" class="btn-fill">Fill credentials</button>
        </div>
        <div class="demo-creds-row">
          <span>Username</span>
          <code>claims.officer</code>
        </div>
        <div class="demo-creds-row">
          <span>Password</span>
          <code>Triage@2024</code>
        </div>
      </div>
    </div>

    <p class="login-footer">For demonstration purposes only &mdash; not for production use.</p>
  </div>

  <script>
    const VALID_USERNAME = 'claims.officer';
    const VALID_PASSWORD = 'Triage@2024';

    const form      = document.getElementById('login-form');
    const usernameEl= document.getElementById('username');
    const passwordEl= document.getElementById('password');
    const errorEl   = document.getElementById('login-error');
    const loginBtn  = document.getElementById('login-btn');
    const fillBtn   = document.getElementById('fill-btn');

    /* One-click credential fill */
    fillBtn.addEventListener('click', () => {
      usernameEl.value = VALID_USERNAME;
      passwordEl.value = VALID_PASSWORD;
      errorEl.textContent = '';
      usernameEl.focus();
    });

    /* Clear error on input */
    [usernameEl, passwordEl].forEach(el => {
      el.addEventListener('input', () => { errorEl.textContent = ''; });
    });

    /* Login submit */
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const user = usernameEl.value.trim();
      const pass = passwordEl.value;

      if (!user || !pass) {
        errorEl.textContent = 'Please enter both username and password.';
        return;
      }

      /* Loading state */
      loginBtn.disabled = true;
      loginBtn.classList.add('loading');
      errorEl.textContent = '';

      /* Simulate auth delay */
      setTimeout(() => {
        if (user === VALID_USERNAME && pass === VALID_PASSWORD) {
          window.location.href = 'index.html';
        } else {
          loginBtn.disabled = false;
          loginBtn.classList.remove('loading');
          errorEl.textContent = 'Incorrect username or password. Please try again.';
          passwordEl.value = '';
          passwordEl.focus();
        }
      }, 800);
    });
  </script>

</body>
</html>
